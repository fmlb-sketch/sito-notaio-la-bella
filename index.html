      window.__loadGA = function () {
        if (window.__gaLoaded) return;
        window.__gaLoaded = true;
        gtag('consent', 'update', { 'analytics_storage': 'granted' });
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-ZJCC76697E';
        document.head.appendChild(s);
        gtag('config', 'G-ZJCC76697E');
      };

      (function () {

          }
        } catch (e) {}
      })();
    </script>

  <body>
    <!--
      Modulo statico "specchio" del form React (vedi src/App.jsx, componente QuoteDialog).
      Serve solo a Netlify per riconoscere il form in fase di build: non viene mostrato
      all'utente. I nomi dei campi devono corrispondere esattamente a quelli del form React.
      Netlify Forms supporta un solo file per campo, per questo ci sono tre campi allegato
      distinti invece di un unico campo con più file.
    -->
    <form name="preventivo" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="text" name="nome" />
      <input type="email" name="email" />
      <input type="tel" name="telefono" />
      <input type="text" name="tipo_atto" />
      <input type="text" name="sede" />
      <input type="text" name="prima_seconda_casa" />
      <input type="text" name="tipologia_terreno" />
      <input type="text" name="compravendita_mutuo" />
      <input type="text" name="importo_mutuo" />
      <input type="text" name="prezzo_vendita" />
      <input type="text" name="rendita_catastale" />
      <input type="text" name="agevolazioni" />
      <input type="text" name="tipologia_societaria" />
      <input type="text" name="tipologia_successione" />
      <input type="text" name="grado_parentela" />
      <textarea name="messaggio"></textarea>
      <input type="file" name="allegato_1" />
      <input type="file" name="allegato_2" />
      <input type="file" name="allegato_3" />
      <input type="text" name="privacy" />
      <input type="text" name="bot-field" />
    </form>

    <div id="cookie-consent-banner" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#F6F3EE;border-top:1px solid #D8D6D0;padding:14px clamp(16px,4vw,32px);font-family:'Public Sans',system-ui,sans-serif;box-sizing:border-box;">
      <div style="max-width:1040px;margin:0 auto;">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;">
          <p style="margin:0;font-size:13.5px;line-height:1.5;color:#5B5B57;flex:1 1 320px;">
            Usiamo cookie tecnici sempre attivi e, previo consenso, Google Analytics in forma aggregata. Consulta la
            <a href="/cookie-policy.html" style="color:#22334C;text-decoration:underline;">Cookie Policy</a>.
          </p>
          <div style="display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap;">
            <button type="button" onclick="window.__cookieCustomizeToggle()" style="border:none;background:transparent;color:#22334C;font-size:13px;font-weight:600;padding:9px 4px;cursor:pointer;text-decoration:underline;">Personalizza</button>
            <button type="button" onclick="window.__cookieConsent(false)" style="border:1px solid #D8D6D0;background:#EFEBE3;color:#22334C;font-size:13px;font-weight:600;padding:9px 16px;border-radius:6px;cursor:pointer;">Rifiuta</button>
            <button type="button" onclick="window.__cookieConsent(true)" style="border:1px solid #22334C;background:#22334C;color:#FBFAF7;font-size:13px;font-weight:600;padding:9px 16px;border-radius:6px;cursor:pointer;">Accetta</button>
          </div>
        </div>
        <div id="cookie-consent-panel" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid #D8D6D0;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0;">
            <div>
              <p style="margin:0;font-size:13px;font-weight:600;color:#22334C;">Cookie necessari</p>
              <p style="margin:2px 0 0;font-size:12px;color:#5B5B57;">Indispensabili al funzionamento del sito. Sempre attivi.</p>
            </div>
            <input type="checkbox" checked disabled style="width:18px;height:18px;accent-color:#22334C;flex:0 0 auto;">
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid #EFEBE3;">
            <div>
              <p style="margin:0;font-size:13px;font-weight:600;color:#22334C;">Statistiche (Google Analytics)</p>
              <p style="margin:2px 0 0;font-size:12px;color:#5B5B57;">Analisi aggregata del traffico e dell'utilizzo del sito.</p>
            </div>
            <input type="checkbox" id="cookie-consent-stats" style="width:18px;height:18px;accent-color:#22334C;flex:0 0 auto;">
          </div>
          <div style="margin-top:12px;text-align:right;">
            <button type="button" onclick="window.__cookieSavePreferences()" style="border:1px solid #22334C;background:#22334C;color:#FBFAF7;font-size:13px;font-weight:600;padding:9px 16px;border-radius:6px;cursor:pointer;">Salva preferenze</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__cookieCustomizeToggle = function () {
        var p = document.getElementById('cookie-consent-panel');
        if (p) p.style.display = (p.style.display === 'block') ? 'none' : 'block';
      };
      window.__cookieConsent = function (statistiche) {
        var prefs = { necessari: true, statistiche: !!statistiche };
        localStorage.setItem('cookie-consent', JSON.stringify(prefs));
        if (prefs.statistiche && window.__loadGA) window.__loadGA();
        var b = document.getElementById('cookie-consent-banner');
        if (b) b.style.display = 'none';
      };
      window.__cookieSavePreferences = function () {
        var checkbox = document.getElementById('cookie-consent-stats');
        window.__cookieConsent(checkbox ? checkbox.checked : false);
      };
      (function () {
        var hasConsent = false;
        try {
          var raw = localStorage.getItem('cookie-consent');
          hasConsent = !!(raw && JSON.parse(raw));
        } catch (e) {}
        if (!hasConsent) {
          document.addEventListener('DOMContentLoaded', function () {
            var b = document.getElementById('cookie-consent-banner');
            if (b) b.style.display = 'block';
          });
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
